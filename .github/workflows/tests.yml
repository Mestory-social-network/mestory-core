name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy mestory_core tests
      - run: uv run pytest -vv
