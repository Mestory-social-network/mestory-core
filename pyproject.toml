[project]
name = "mestory-core"
version = "0.1.6"
requires-python = ">=3.12,<4.0"
description = "Общий код сервисов Mestory: авторизация, права, события."
readme = "README.md"
dependencies = [
  "fastapi >=0.122.0,<1",
  "pydantic >=2.12.5,<3",
  "pyjwt[crypto] >=2.10.1,<3",
  "httpx >=0.28.1,<1",
  "aio-pika >=9.5.8,<10",
]

[dependency-groups]
dev = [
  "pytest >=9.0.1,<10",
  "anyio >=4.11.0,<5",
  "ruff >=0.14.6,<1",
  "mypy >=1.19.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mestory_core"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
anyio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py313"
line-length = 88
lint.select = [
  "E", "F", "W", "C90", "I", "N", "D", "ANN", "S", "B", "C4", "ISC",
  "PIE", "T20", "PYI", "Q", "RSE", "RET", "SLF", "SIM", "PTH", "ERA",
  "PL", "RUF", "FA102", "UP",
]
lint.ignore = [
  "D105", "D107", "B008", "D211", "D212", "D401", "D104", "D100",
  "D202", "ANN401", "PLR0913", "D106", "UP043",
  # Докстринги и комментарии проекта написаны по-русски целиком, поэтому
  # правила о неоднозначных Unicode-символах для них — чистый шум.
  # RUF001 намеренно оставлен включённым: кириллица в строковом литерале —
  # вероятная ошибка (например, спутанная буква в идентификаторе-строке).
  "RUF002", "RUF003",
]
lint.mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
